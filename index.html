<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Broker Terminal PRO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= TOP BAR ================= -->
<div class="topbar">
  <div class="brand">📈 Broker Terminal</div>

  <div id="balance">Balance: $100</div>

  <div class="right">
    <span id="welcome">Guest</span>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="screen">
  <h1>Welcome Trader</h1>
  <input id="usernameInput" placeholder="Enter username" />
  <button onclick="startApp()">Start Trading</button>
</div>

<!-- ================= MAIN APP ================= -->
<div id="app" class="hidden dashboard">

  <!-- MARKET -->
  <div class="panel left">
    <h3>Market Watch</h3>
    <div id="market"></div>
  </div>

  <!-- PORTFOLIO -->
  <div class="panel centerPanel">
    <h3>Portfolio</h3>
    <div id="portfolio"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
