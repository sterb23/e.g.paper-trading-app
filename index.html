<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <h1>Trade Terminal</h1>
  <input id="usernameInput" placeholder="Enter username">
  <button onclick="startApp()">Start Trading</button>
</div>

<!-- TUTORIAL -->
<div id="tutorialScreen" class="screen hidden">
  <h2>Trading Onboarding</h2>
  <p id="tutorialText"></p>
  <button onclick="nextTutorial()">Next</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="topbar">
    <div id="welcome"></div>
    <div id="balance"></div>
  </div>

  <div class="container">
    <h3>Market Watch</h3>
    <div id="market"></div>

    <h3>Portfolio</h3>
    <div id="portfolio"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
