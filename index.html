<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Broker Terminal V8.1</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">📊 Broker Terminal V8.1</div>

  <div>Balance: $<span id="balance">100</span></div>

  <div>
    <span id="welcome"></span>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <h1>Trade Terminal</h1>
  <input id="usernameInput" placeholder="Username" />
  <button onclick="startApp()">Start</button>
</div>

<!-- TUTORIAL -->
<div id="tutorialScreen" class="screen hidden">
  <h2>Tutorial</h2>
  <p id="tutorialText"></p>
  <button onclick="nextTutorial()">Next</button>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden dashboard">

  <div class="panel left">
    <h3>Market</h3>
    <div id="market"></div>
  </div>

  <div class="panel center">
    <h3>Portfolio</h3>
    <div id="portfolio"></div>
  </div>

</div>

<!-- ================= CHART MODAL (FIXED SAFE LAYER) ================= -->
<div id="chartModal" class="hidden modal">

  <div class="modalBox">

    <div class="modalHeader">
      <span>Chart</span>

      <!-- IMPORTANT: THIS MUST CALL closeChart() -->
      <button class="closeBtn" onclick="closeChart()">✕</button>
    </div>

    <canvas id="chartCanvas"></canvas>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
