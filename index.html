<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLearn Broker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <h1>TradeLearn Broker</h1>
  <input id="usernameInput" placeholder="Enter username">
  <button onclick="startApp()">Start</button>
</div>

<!-- TUTORIAL (FORCED) -->
<div id="tutorialScreen" class="screen hidden">
  <h2 id="tTitle">Tutorial</h2>
  <p id="tText"></p>
  <button onclick="nextTutorial()">Next</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="topbar">
    <div id="welcome"></div>
    <div id="balance"></div>
  </div>

  <div class="container">

    <h3>📈 Market</h3>
    <div id="market"></div>

    <h3>💼 Portfolio</h3>
    <div id="portfolio"></div>

    <h3>📊 Chart</h3>
    <canvas id="chart" width="350" height="180"></canvas>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
