<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trade Terminal PRO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="screen">
  <h1>Trade Terminal PRO</h1>

  <input id="usernameInput" placeholder="Enter username" />

  <button onclick="startApp()">Start</button>
</div>

<!-- ================= TUTORIAL ================= -->
<div id="tutorialScreen" class="screen hidden">
  <h2>Onboarding</h2>

  <p id="tutorialText"></p>

  <button onclick="nextTutorial()">Next</button>
</div>

<!-- ================= MAIN APP ================= -->
<div id="app" class="hidden">

  <!-- TOP BAR -->
  <div class="topbar">
    <div id="welcome">Welcome</div>
    <div id="balance">Balance: $100</div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- MARKET -->
    <div class="panel">
      <h3>Market</h3>
      <div id="market"></div>
    </div>

    <!-- PORTFOLIO -->
    <div class="panel">
      <h3>Portfolio</h3>
      <div id="portfolio"></div>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
