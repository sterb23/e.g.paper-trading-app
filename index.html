<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Broker Terminal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= TOP NAV BAR ================= -->
<div class="topbar">

  <div class="brand">
    📈 Broker Terminal
  </div>

  <div class="center">
    <div id="balance">Balance: $100</div>
  </div>

  <div class="right">
    <div id="welcome">Guest</div>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="screen">
  <h1>Welcome Trader</h1>
  <input id="usernameInput" placeholder="Enter username" />
  <button onclick="startApp()">Start Trading</button>
</div>

<!-- ================= TUTORIAL ================= -->
<div id="tutorialScreen" class="screen hidden">
  <h2>Getting Started</h2>
  <p id="tutorialText"></p>
  <button onclick="nextTutorial()">Next</button>
</div>

<!-- ================= MAIN DASHBOARD ================= -->
<div id="app" class="hidden dashboard">

  <!-- LEFT: MARKET WATCH -->
  <div class="panel left">
    <h3>Market Watch</h3>
    <div id="market"></div>
  </div>

  <!-- CENTER: PORTFOLIO -->
  <div class="panel centerPanel">
    <h3>Portfolio Overview</h3>
    <div id="portfolio"></div>

    <div class="card">
      <h4>Account Summary</h4>
      <p id="summary">Loading...</p>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
